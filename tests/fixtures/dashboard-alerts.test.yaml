                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: reset_read_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: reset_redeem_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
