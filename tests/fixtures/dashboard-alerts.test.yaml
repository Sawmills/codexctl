      - eval_time: 6m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_last_failure_timestamp_seconds{reason="dashboard_actions_unavailable",pod="pod-c"}
        values: >-
          0 60 60 60 60 60 60
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts:
          - exp_labels:
              reason: dashboard_actions_unavailable
              severity: warning
