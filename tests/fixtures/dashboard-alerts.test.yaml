rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: codexctl_central_billed_selections_total{path="auto",pod="pod-a"}
        values: 0+0x10
      - series: codexctl_central_billed_selections_total{path="explicit",pod="pod-a"}
        values: 1+1x10
    alert_rule_test:
      - eval_time: 5m
        alertname: CodexctlAutomaticBillingSelected
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_billed_selections_total{path="auto",pod="new-pod"}
        values: _ 1 1 0 0
    alert_rule_test:
      - eval_time: 1m
        alertname: CodexctlAutomaticBillingSelected
        exp_alerts:
          - exp_labels:
              severity: critical
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl selected a credit-billing account automatically
              description: Automatic selection must use included subscription accounts only. Inspect the billed-selection outcome logs, use an explicitly selected subscription account, and fix the selection guard. Token probes and refreshes must not count as selections.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/relay.md
      - eval_time: 3m
        alertname: CodexctlAutomaticBillingSelected
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_lane_stops_total{reason="capacity",pod="pod-a"}
        values: 0+1x1440
      - series: codexctl_central_lane_stops_total{reason="capacity",pod="pod-b"}
        values: 0+1x1440
    promql_expr_test:
      - expr: codexctl:lane_stops:increase1d{reason="capacity"}
        eval_time: 1d
        exp_samples:
          - labels: codexctl:lane_stops:increase1d{reason="capacity"}
            value: 2880
  - interval: 1m
    input_series:
      - series: codexctl_central_billed_selections_total{path="auto",pod="pod-a"}
        values: _ 1+0x70
    alert_rule_test:
      - eval_time: 61m
        alertname: CodexctlAutomaticBillingSelected
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_owner_refresh_failed_total{account="personal",account_key="example-key",reason="refresh_token_invalidated",pod="pod-a"}
        values: _ 1+0x24
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlOwnerRefreshRejected
        exp_alerts:
          - exp_labels:
              account: personal
              account_key: example-key
              reason: refresh_token_invalidated
              pod: pod-a
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl server account personal (example-key) lost its refresh grant (refresh_token_invalidated)
              description: The provider rejected the stored refresh grant, so token requests for this account fail until it is renewed with a device code. Check the owner_refresh and owner_child log lines for the provider reason.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
      - eval_time: 12m
        alertname: CodexctlOwnerRefreshRejected
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_failed_requests_total{reason="owner_unavailable",pod="pod-a"}
        values: 0 3 6 9 12 15 18 21 24 28 32 32+0x20
    alert_rule_test:
      - eval_time: 10m
        alertname: CodexctlOwnerUnavailableRate
        exp_alerts:
          - exp_labels:
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl token requests keep failing with owner_unavailable
              description: More than five token requests failed with owner_unavailable in 15 minutes. Inspect native child start and settlement errors in the broker logs.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-ha.md
      - eval_time: 26m
        alertname: CodexctlOwnerUnavailableRate
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_failed_requests_total{reason="owner_unavailable",pod="pod-a"}
        values: 0+0x15 5+0x15
    alert_rule_test:
      - eval_time: 16m
        alertname: CodexctlOwnerUnavailableRate
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_failed_requests_total{reason="owner_unavailable",pod="pod-a"}
        values: 0+0x15 6+0x20
    alert_rule_test:
      - eval_time: 16m
        alertname: CodexctlOwnerUnavailableRate
        exp_alerts:
          - exp_labels:
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl token requests keep failing with owner_unavailable
              description: More than five token requests failed with owner_unavailable in 15 minutes. Inspect native child start and settlement errors in the broker logs.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-ha.md
      - eval_time: 32m
        alertname: CodexctlOwnerUnavailableRate
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_owner_refresh_native_errors_total{account="personal",account_key="example-key",reason="upstream_5xx",pod="pod-a"}
        values: 0 1+0x13
      - series: codexctl_central_owner_refresh_native_errors_total{account="personal",account_key="example-key",reason="upstream_5xx",pod="pod-b"}
        values: 0+0x14
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlOwnerRefreshNativeError
        exp_alerts:
          - exp_labels:
              account: personal
              account_key: example-key
              reason: upstream_5xx
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl server account personal (example-key) has a native refresh error (upstream_5xx)
              description: Inspect bounded owner_refresh diagnostics and upstream status. An unclassified failure does not revoke a valid token. Billing requests refuse when fresh evidence is unavailable. Preserve the owner journal and lease while a native call settles.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
      - eval_time: 12m
        alertname: CodexctlOwnerRefreshNativeError
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_owner_refresh_native_errors_total{account="personal",account_key="example-key",reason="upstream_timeout",pod="restarted"}
        values: 1+0x14
    alert_rule_test:
      - eval_time: 1m
        alertname: CodexctlOwnerRefreshNativeError
        exp_alerts:
          - exp_labels:
              account: personal
              account_key: example-key
              reason: upstream_timeout
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl server account personal (example-key) has a native refresh error (upstream_timeout)
              description: Inspect bounded owner_refresh diagnostics and upstream status. An unclassified failure does not revoke a valid token. Billing requests refuse when fresh evidence is unavailable. Preserve the owner journal and lease while a native call settles.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
      - eval_time: 12m
        alertname: CodexctlOwnerRefreshNativeError
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_last_failure_timestamp_seconds{reason="dashboard_revoke_failed",pod="pod-a"}
        values: >-
          0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="dashboard_revoke_failed",pod="pod-b"}
        values: >-
          0 0 0 0 0 0 0
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts:
          - exp_labels:
              reason: dashboard_revoke_failed
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl account operation failed
              description: A dashboard operation failed. Inspect the dashboard reason and stage in structured logs, database health, and browser-session storage. Check machine status before retrying Revoke, or the retained login receipt and native journal before retrying Add.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
      - eval_time: 6m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_last_failure_timestamp_seconds{reason="dashboard_audit_failed",pod="pod-c"}
        values: >-
          0 60 60 60 60 60 60
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts:
          - exp_labels:
              reason: dashboard_audit_failed
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl account operation failed
              description: A dashboard operation failed. Inspect the dashboard reason and stage in structured logs, database health, and browser-session storage. Check machine status before retrying Revoke, or the retained login receipt and native journal before retrying Add.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
      - eval_time: 6m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_last_failure_timestamp_seconds{reason="browser_sessions_unavailable",pod="pod-c"}
        values: >-
          0 60 60 60 60 60 60
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts:
          - exp_labels:
              reason: browser_sessions_unavailable
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl account operation failed
              description: A dashboard operation failed. Inspect the dashboard reason and stage in structured logs, database health, and browser-session storage. Check machine status before retrying Revoke, or the retained login receipt and native journal before retrying Add.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
      - eval_time: 6m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_last_failure_timestamp_seconds{reason="dashboard_guard_unavailable",pod="pod-c"}
        values: >-
          0 60 60 60 60 60 60
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts:
          - exp_labels:
              reason: dashboard_guard_unavailable
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl account operation failed
              description: A dashboard operation failed. Inspect the dashboard reason and stage in structured logs, database health, and browser-session storage. Check machine status before retrying Revoke, or the retained login receipt and native journal before retrying Add.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
      - eval_time: 6m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_last_failure_timestamp_seconds{reason="dashboard_actions_unavailable",pod="pod-c"}
        values: >-
          0 60 60 60 60 60 60
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts:
          - exp_labels:
              reason: dashboard_actions_unavailable
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl account operation failed
              description: A dashboard operation failed. Inspect the dashboard reason and stage in structured logs, database health, and browser-session storage. Check machine status before retrying Revoke, or the retained login receipt and native journal before retrying Add.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
      - eval_time: 6m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_last_failure_timestamp_seconds{reason="dashboard_registry_changed",pod="pod-c"}
        values: >-
          0 60 60 60 60 60 60
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts:
          - exp_labels:
              reason: dashboard_registry_changed
              severity: warning
              service: codexctl
              environment: staging
            exp_annotations:
              summary: Codexctl account operation failed
              description: A dashboard operation failed. Inspect the dashboard reason and stage in structured logs, database health, and browser-session storage. Check machine status before retrying Revoke, or the retained login receipt and native journal before retrying Add.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
      - eval_time: 6m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_last_failure_timestamp_seconds{reason="owner_unavailable",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="catalog_owner_unavailable",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="catalog_usage_failed",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="catalog_usage_timeout",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="catalog_task_failed",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="live_session_failed",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="persistence_failed",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="registry_unavailable",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="registry_busy",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="import_unavailable",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="recovery_failed",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="relogin_failed",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="relogin_identity_unresolved",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="reset_read_failed",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="reset_redeem_failed",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="reset_rejected",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_last_failure_timestamp_seconds{reason="token_evidence_clear_failed",pod="pod-owner"}
        values: 0 60 60 60 60 60 60
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts:
          - exp_labels:
              {
                reason: owner_unavailable,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: &owner_annotations
              summary: Codexctl account operation failed
              description: Inspect the broker reason and stage in structured logs. Usage fetch failures do not imply token delivery failure. Check the saved owner journal before any account import retry.
              runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
          - exp_labels:
              {
                reason: catalog_owner_unavailable,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: catalog_usage_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: catalog_usage_timeout,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: catalog_task_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: live_session_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: persistence_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: registry_unavailable,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: registry_busy,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: import_unavailable,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: recovery_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: relogin_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: relogin_identity_unresolved,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: reset_read_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: reset_redeem_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: reset_rejected,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
          - exp_labels:
              {
                reason: token_evidence_clear_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
      - eval_time: 6m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: codexctl_central_ownership_unresolved{reason="recovery_failed",pod="pod-owner"}
        values: 0 0 1 1 0 0 0
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts:
          - exp_labels:
              {
                reason: recovery_failed,
                severity: warning,
                service: codexctl,
                environment: staging,
              }
            exp_annotations: *owner_annotations
      - eval_time: 4m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts: []

  # Browser starts are intentionally off until the separate rollout GO.
  - interval: 1m
    input_series:
      - series: codexctl_central_last_failure_timestamp_seconds{reason="dashboard_login_disabled",pod="pod-browser"}
        values: 0 60 60 60 60 60 60
      - series: codexctl_central_failed_requests_total{reason="dashboard_login_disabled",pod="pod-browser"}
        values: 0+10x6
    alert_rule_test:
      - eval_time: 2m
        alertname: CodexctlCredentialOperationFailed
        exp_alerts: []
