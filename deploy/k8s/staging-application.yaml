# Bootstrap reference; this is not the registered Application's full sync policy.
# The registered argocd/codexctl Application auto-syncs main with prune and selfHeal.
# This reference omits syncPolicy.automated. Inspect the live Application before
# registration or policy changes; see docs/central-server.md#staging-deployment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: codexctl
  namespace: argocd
spec:
  project: sawmills
  source:
    repoURL: https://github.com/Sawmills/codexctl.git
    targetRevision: main
    path: deploy/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: codexctl
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
