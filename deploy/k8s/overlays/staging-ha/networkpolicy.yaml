apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: codexctl
  name: codexctl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codexctl
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Internal ALB target connections use private VPC addresses.
        - ipBlock: { cidr: 10.1.0.0/16 }
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: http }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        # OpenAI and the configured company issuer use HTTPS.
        - { protocol: TCP, port: 443 }
    - to:
        # The shared quota-manager RDS instance is private in the staging VPC.
        - ipBlock: { cidr: 10.1.0.0/16 }
      ports:
        - { protocol: TCP, port: 5432 }
