apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: codexctl
  name: codexctl
  labels:
    release: kube-prometheus
    environment: staging
spec:
  groups:
    - name: codexctl
      rules:
        - alert: CodexctlBrokerUnavailable
          expr: up{namespace="codexctl",service="codexctl"} == 0 or absent(up{namespace="codexctl",service="codexctl"})
          for: 5m
          labels:
            severity: warning
            service: codexctl
            environment: staging
          annotations:
            summary: Codexctl token server is unavailable
            description: Check the pod, SSO configuration, and persistent credential journal. Preserve the journal before recovery.
            runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
        - alert: CodexctlCredentialOperationFailed
          expr: time() - max by (reason) (codexctl_central_last_failure_timestamp_seconds{reason=~"owner_unavailable|catalog_owner_unavailable|catalog_usage_failed|catalog_usage_timeout|catalog_task_failed|persistence_failed|registry_unavailable|registry_busy|import_unavailable|recovery_failed|relogin_failed|reset_read_failed"} > 0) < 300 or max by (reason) (codexctl_central_ownership_unresolved == 1)
          for: 0m
          labels:
            severity: warning
            service: codexctl
            environment: staging
          annotations:
            summary: Codexctl account operation failed
            description: Inspect the broker reason and stage in structured logs. Usage fetch failures do not imply token delivery failure. Check the saved owner journal before any account import retry.
            runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
---
# The staging ServiceMonitor schema lacks authentication. ScrapeConfig supports
# credentials and is already selected by the existing Prometheus operator.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  namespace: codexctl
  name: codexctl
  labels:
    release: kube-prometheus
spec:
  jobName: codexctl
  metricsPath: /metrics
  scrapeInterval: 30s
  scrapeTimeout: 5s
  scrapeProtocols: [PrometheusText0.0.4]
  authorization:
    type: Bearer
    credentials:
      name: codexctl-secrets
      key: metrics-token
  staticConfigs:
    - targets: [codexctl.codexctl.svc.cluster.local:80]
      labels:
        namespace: codexctl
        service: codexctl
