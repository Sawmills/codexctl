apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: codexctl
  name: codexctl
  labels:
    release: kube-prometheus
    environment: staging
spec:
  groups:
    - name: codexctl
      rules:
        - record: codexctl:lane_stops:increase1d
          expr: sum by (reason) (increase(codexctl_central_lane_stops_total[1d]))
        - alert: CodexctlAutomaticBillingSelected
          expr: |
            sum(increase(codexctl_central_billed_selections_total{path="auto"}[1h])) > 0
            or
            sum(codexctl_central_billed_selections_total{path="auto"}
              unless codexctl_central_billed_selections_total{path="auto"} offset 1h) > 0
          for: 0m
          labels:
            severity: critical
            service: codexctl
            environment: staging
          annotations:
            summary: Codexctl selected a credit-billing account automatically
            description: Automatic selection must use included subscription accounts only. Inspect the billed-selection outcome logs, use an explicitly selected subscription account, and fix the selection guard. Token probes and refreshes must not count as selections.
            runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/relay.md
        - alert: CodexctlBrokerUnavailable
          expr: up{namespace="codexctl",service="codexctl"} == 0 or absent(up{namespace="codexctl",service="codexctl"})
          for: 5m
          labels:
            severity: warning
            service: codexctl
            environment: staging
          annotations:
            summary: Codexctl account-server scrape target is unavailable
            description: A configured replica is down or all scrape targets are absent. Other HA replicas may still serve requests. Target gaps are expected during the announced cutover outage. Check the affected pod and preserve its credential journal before recovery.
            runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
        - alert: CodexctlCredentialOperationFailed
          expr: time() - max by (reason) (codexctl_central_last_failure_timestamp_seconds{reason=~"owner_unavailable|catalog_owner_unavailable|catalog_usage_failed|catalog_usage_timeout|catalog_task_failed|live_session_failed|persistence_failed|registry_unavailable|registry_busy|import_unavailable|recovery_failed|relogin_failed|relogin_identity_unresolved|reset_read_failed|reset_redeem_failed|reset_rejected|token_evidence_clear_failed|browser_sessions_unavailable|dashboard_revoke_failed|dashboard_audit_failed|dashboard_guard_unavailable|dashboard_actions_unavailable|dashboard_registry_changed"} > 0) < 300 or max by (reason) (codexctl_central_ownership_unresolved == 1)
          for: 0m
          labels:
            severity: warning
            service: codexctl
            environment: staging
          annotations:
            summary: Codexctl account operation failed
            description: '{{ if match "^(dashboard_.*|browser_sessions_unavailable)$" $labels.reason }}A dashboard operation failed. Inspect the dashboard reason and stage in structured logs, database health, and browser-session storage. Check machine status before retrying Revoke, or the retained login receipt and native journal before retrying Add.{{ else }}Inspect the broker reason and stage in structured logs. Usage fetch failures do not imply token delivery failure. Check the saved owner journal before any account import retry.{{ end }}'
            runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
        - alert: CodexctlOwnerRefreshNativeError
          expr: |
            sum by (account, account_key, reason) (
              (increase(codexctl_central_owner_refresh_native_errors_total[10m]) > 0)
              or
              ((codexctl_central_owner_refresh_native_errors_total > 0) unless codexctl_central_owner_refresh_native_errors_total offset 10m)
            ) > 0
          for: 0m
          labels:
            severity: warning
            service: codexctl
            environment: staging
          annotations:
            summary: "Codexctl server account {{ $labels.account }} ({{ $labels.account_key }}) has a native refresh error ({{ $labels.reason }})"
            description: Inspect bounded owner_refresh diagnostics and upstream status. An unclassified failure does not revoke a valid token. Billing requests refuse when fresh evidence is unavailable. Preserve the owner journal and lease while a native call settles.
            runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
        - alert: CodexctlRelayCapacityExhausted
          expr: max by (kind, model, account_class) (codexctl_central_relay_capacity_event_timestamp_seconds{outcome="exhausted"} > bool (time() - 900)) > 0
          for: 0m
          labels:
            severity: warning
            service: codexctl
            environment: staging
          annotations:
            summary: Codexctl relay exhausted its capacity retry budget
            description: A relay lane exhausted its retry budget in the last 15 minutes. The advised outcome is intentionally excluded because it is still retrying without operator action.
            runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/relay.md
        - alert: CodexctlTokenLeaseWaitTimeouts
          expr: sum(increase(codexctl_central_lease_waits_total{outcome="timeout"}[15m])) > 3
          for: 0m
          labels:
            severity: warning
            service: codexctl
            environment: staging
          annotations:
            summary: Codexctl token requests time out waiting for an account lease
            description: More than three token requests failed with refresh_in_progress after waiting 15 seconds for another replica's lease in 15 minutes. Check lease holders and stuck refresh children.
            runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-ha.md
        - alert: CodexctlOwnerUnavailableRate
          expr: sum(increase(codexctl_central_failed_requests_total{reason="owner_unavailable"}[15m])) > 5
          for: 0m
          labels:
            severity: warning
            service: codexctl
            environment: staging
          annotations:
            summary: Codexctl token requests keep failing with owner_unavailable
            description: More than five token requests failed with owner_unavailable in 15 minutes. Inspect native child start and settlement errors in the broker logs.
            runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-ha.md
        # SAW-12651: the first rejected refresh grant per account, before token
        # requests start failing with owner_unavailable. The `unless offset`
        # branch fires on a new series, which increase() cannot see.
        # Routed to warnings-slack (#warning-alerts) by a per-account route in
        # infra helm-charts/prometheus/staging/values.yaml.
        - alert: CodexctlOwnerRefreshRejected
          expr: |
            (increase(codexctl_central_owner_refresh_failed_total[10m]) > 0)
            or
            (codexctl_central_owner_refresh_failed_total unless codexctl_central_owner_refresh_failed_total offset 10m)
          for: 0m
          labels:
            severity: warning
            service: codexctl
            environment: staging
          annotations:
            summary: "Codexctl server account {{ $labels.account }} ({{ $labels.account_key }}) lost its refresh grant ({{ $labels.reason }})"
            description: The provider rejected the stored refresh grant, so token requests for this account fail until it is renewed with a device code. Check the owner_refresh and owner_child log lines for the provider reason.
            runbook_url: https://github.com/Sawmills/codexctl/blob/main/docs/central-server.md
---
# The staging ServiceMonitor schema lacks authentication. ScrapeConfig supports
# credentials and is already selected by the existing Prometheus operator.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  namespace: codexctl
  name: codexctl
  labels:
    release: kube-prometheus
spec:
  jobName: codexctl
  metricsPath: /metrics
  scrapeInterval: 30s
  scrapeTimeout: 5s
  scrapeProtocols: [PrometheusText0.0.4]
  authorization:
    type: Bearer
    credentials:
      name: codexctl-secrets
      key: metrics-token
  # B33 attempt 4, PR H: one target per HA pod. The labels keep the existing
  # alert expressions valid.
  dnsSDConfigs:
    - names: [codexctl-ha-pods.codexctl.svc.cluster.local]
      type: A
      port: 8787
  relabelings:
    - targetLabel: namespace
      replacement: codexctl
    - targetLabel: service
      replacement: codexctl
