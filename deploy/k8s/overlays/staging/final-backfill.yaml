# B33 next attempt: ordinary wave-1 Job, never a repeating Sync hook.
# No TTL: retain completion so Argo does not recreate it after HA starts.
# Freeze its full image reference: future broker pins must not mutate this Job.
# A failed Job stops wave 2; retries require HQ review and a new Job name.
apiVersion: batch/v1
kind: Job
metadata:
  name: codexctl-final-backfill-a5
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    checkov.io/skip1: CKV2_K8S_6=NetworkPolicy codexctl-migration selects this pod.
    checkov.io/skip2:
      CKV_K8S_35=Database credentials come from the codexctl-postgres
      ExternalSecret by design.
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codexctl-migration
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      initContainers:
        - name: prepare-secrets
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -ec
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - cp /projected/vault-key /keys/vault-key; chmod 600 /keys/vault-key
          volumeMounts:
            - name: projected
              mountPath: /projected
              readOnly: true
            - name: keys
              mountPath: /keys
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: backfill
          image: 767398060436.dkr.ecr.us-east-1.amazonaws.com/codexctl-central@sha256:6374438eca220c90904c3d1623dc8fd91e18f65c27908fc9c828a0d55b74979e
          command:
            - codexctl-central
            - backfill
            - --state
            - /data/state
            - --key-file
            - /keys/vault-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: CODEXCTL_CENTRAL_STORE
              value: postgres
            - name: CODEXCTL_CENTRAL_DB_CA_FILE
              value: /etc/codexctl/rds-ca/global-bundle.pem
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-hostname
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-password
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/codexctl/rds-ca
              readOnly: true
            - name: state
              mountPath: /data
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: temporary
              mountPath: /tmp
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: rds-ca
          configMap:
            name: codexctl-rds-ca
        - name: state
          persistentVolumeClaim:
            claimName: state-codexctl-0
        - name: projected
          secret:
            secretName: codexctl-secrets
            defaultMode: 288
        - name: keys
          emptyDir:
            medium: Memory
        - name: temporary
          emptyDir: {}
      automountServiceAccountToken: false
  backoffLimit: 0
  activeDeadlineSeconds: 1800
