# B33 attempt 4, PR H: one DNS record per HA pod, so Prometheus scrapes every
# replica, including one that fails readiness.
apiVersion: v1
kind: Service
metadata:
  namespace: codexctl
  name: codexctl-ha-pods
  labels:
    app.kubernetes.io/name: codexctl-ha
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: codexctl-ha
    app.kubernetes.io/component: broker-ha
  ports:
    - name: http
      port: 8787
      targetPort: http
