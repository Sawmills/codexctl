# DESTRUCTIVE: prepared for review only. No Kustomization includes this Job.
# Separate HQ GO, staging DB backup, stopped PostgreSQL writers and settled
# leases are required. Never run against a serving store or production.
# Layout-8 allowlist only; preserves both schema/progress tables; no CASCADE.
apiVersion: batch/v1
kind: Job
metadata:
  namespace: codexctl
  generateName: codexctl-reset-data-
  labels:
    app.kubernetes.io/name: codexctl-migration
    app.kubernetes.io/component: reset-data
  annotations:
    checkov.io/skip1: CKV2_K8S_6=NetworkPolicy codexctl-migration selects this pod.
    checkov.io/skip2:
      CKV_K8S_35=Database credentials come from the codexctl-postgres
      ExternalSecret by design.
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codexctl-migration
        app.kubernetes.io/component: reset-data
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query
          image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
          imagePullPolicy: Always
          command:
            - sh
            - -ec
          args:
            - "psql -X -v ON_ERROR_STOP=1 <<'SQL'\nBEGIN;\nSET LOCAL lock_timeout = '5s';\n\
              SET LOCAL statement_timeout = '60s';\nDO $guard$\nDECLARE actual text[];\n\
              BEGIN\n  SELECT array_agg(tablename::text ORDER BY tablename) INTO actual\n\
              \    FROM pg_tables WHERE schemaname = 'public';\n  IF actual IS DISTINCT\
              \ FROM ARRAY['account_live_sessions','account_loan_audit','account_loans','account_refresh_leases','central_account_claims','central_account_identity_claims','central_accounts','central_alias_tombstones','central_devices','central_identity_migration_progress','central_login_holders','central_login_identity_reservation_history','central_login_identity_reservations','central_login_operations','central_relay_rate_limits','central_schema_migrations','central_token_evidence','central_users','enrollment_challenges'\
              \ ]::text[] THEN\n    RAISE EXCEPTION 'unexpected codexctl table inventory;\
              \ new review required';\n  END IF;\n  IF (SELECT max(version) FROM public.central_schema_migrations)\
              \ IS DISTINCT FROM 8 THEN\n    RAISE EXCEPTION 'reset requires layout 8';\n\
              \  END IF;\n  IF EXISTS (SELECT 1 FROM public.account_refresh_leases WHERE\
              \ NOT released) THEN\n    RAISE EXCEPTION 'unreleased refresh lease; settle\
              \ owners before reset';\n  END IF;\n  IF EXISTS (SELECT 1 FROM public.central_login_holders\
              \ WHERE expires_at > now() AND deleted_at IS NULL) THEN\n    RAISE EXCEPTION\
              \ 'live login holder; stop owners before reset';\n  END IF;\nEND\n$guard$;\n\
              TRUNCATE TABLE\n  public.account_live_sessions,\n  public.account_loan_audit,\n\
              \  public.account_loans,\n  public.account_refresh_leases,\n  public.central_account_claims,\n\
              \  public.central_account_identity_claims,\n  public.central_accounts,\n\
              \  public.central_alias_tombstones,\n  public.central_devices,\n  public.central_login_holders,\n\
              \  public.central_login_identity_reservation_history,\n  public.central_login_identity_reservations,\n\
              \  public.central_login_operations,\n  public.central_relay_rate_limits,\n\
              \  public.central_token_evidence,\n  public.central_users,\n  public.enrollment_challenges;\n\
              COMMIT;\nSELECT table_name,\n       (xpath('/row/c/text()', query_to_xml(format('SELECT\
              \ count(*) AS c FROM public.%I', table_name), false, true, '')))[1]::text::bigint\
              \ AS row_count\nFROM information_schema.tables\nWHERE table_schema = 'public'\
              \ AND table_type = 'BASE TABLE'\nORDER BY table_name;\nSQL\n"
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-hostname
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-port
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-name
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-password
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/codexctl/rds-ca/global-bundle.pem
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/codexctl/rds-ca
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: rds-ca
          configMap:
            name: codexctl-rds-ca
        - name: temporary
          emptyDir: {}
