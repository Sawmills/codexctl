# B33 database inventory before and after migrate (runbook prerequisite 3).
# No kustomization includes this file, so nothing syncs it. The operator runs
#   kubectl -n codexctl create -f deploy/k8s/jobs/b33-check-empty.yaml
# at go/no-go before migrate, and creates a new instance after migrate.
# Before migrate, require no application tables in the fresh A5 DB. Afterward,
# require the exact layout-8 inventory with metadata-only counts per the runbook.
# Counts are bounded at 50001 rows per table. A cap hit fails the Job; retain
# notices from stderr as the count receipt and never proceed on partial output.
# A rollback uses b33-check-leases.yaml.
# Every statement runs in a read-only transaction, and the job label selects
# the codexctl-migration egress policy.
apiVersion: batch/v1
kind: Job
metadata:
  namespace: codexctl
  generateName: codexctl-check-empty-
  labels:
    app.kubernetes.io/name: codexctl-migration
    app.kubernetes.io/component: check-empty
  annotations:
    checkov.io/skip1: CKV2_K8S_6=NetworkPolicy codexctl-migration selects this pod.
    checkov.io/skip2: CKV_K8S_35=Database credentials come from the codexctl-postgres ExternalSecret by design.
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codexctl-migration
        app.kubernetes.io/component: check-empty
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: query
          image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
          imagePullPolicy: Always
          command: [sh, -ec]
          args:
            - |
              psql -X -v ON_ERROR_STOP=1 <<'SQL'
              \echo '== inventory (prerequisite 3): before migrate require no tables; after migrate verify layout and metadata counts per runbook'
              SET client_min_messages = notice;
              DO $inventory$
              DECLARE
                inventory_table record;
                row_count bigint;
                table_count integer := 0;
                allowed_schema name := current_schema();
              BEGIN
                IF pg_catalog.current_database() <> 'codexctl_a5' THEN
                  RAISE EXCEPTION 'inventory requires codexctl_a5';
                END IF;
                -- Discover every application table from catalog metadata first.
                -- Any table outside the selected schema fails before a row probe.
                FOR inventory_table IN
                  SELECT table_schema, table_name
                  FROM information_schema.tables
                  WHERE table_type = 'BASE TABLE'
                    AND table_schema NOT IN ('pg_catalog', 'information_schema')
                    AND table_schema NOT LIKE 'pg_toast%'
                    AND table_schema NOT LIKE 'pg_temp%'
                  ORDER BY table_schema, table_name
                LOOP
                  IF inventory_table.table_schema <> allowed_schema::text THEN
                    RAISE EXCEPTION 'inventory table %.% outside allowed schema %',
                                    inventory_table.table_schema,
                                    inventory_table.table_name,
                                    allowed_schema;
                  END IF;
                END LOOP;
                FOR inventory_table IN
                  SELECT table_schema, table_name
                  FROM information_schema.tables
                  WHERE table_schema = allowed_schema::text AND table_type = 'BASE TABLE'
                  ORDER BY table_name
                LOOP
                  EXECUTE format('SELECT count(*) FROM (SELECT 1 FROM %I.%I LIMIT 50001) s',
                                 inventory_table.table_schema, inventory_table.table_name)
                    INTO row_count;
                  IF row_count >= 50001 THEN
                    RAISE EXCEPTION 'inventory table % exceeds 50000 rows; stop the window',
                                    inventory_table.table_name;
                  END IF;
                  RAISE NOTICE 'inventory table=% row_count=%', inventory_table.table_name, row_count;
                  table_count := table_count + 1;
                END LOOP;
                RAISE NOTICE 'inventory complete tables=%', table_count;
              END
              $inventory$;
              SQL
          env:
            - name: PGHOST
              valueFrom:
                { secretKeyRef: { name: codexctl-postgres, key: db-hostname } }
            - name: PGPORT
              valueFrom:
                { secretKeyRef: { name: codexctl-postgres, key: db-port } }
            - name: PGDATABASE
              valueFrom:
                { secretKeyRef: { name: codexctl-postgres, key: db-name } }
            - name: PGUSER
              valueFrom:
                { secretKeyRef: { name: codexctl-postgres, key: db-user } }
            - name: PGPASSWORD
              valueFrom:
                { secretKeyRef: { name: codexctl-postgres, key: db-password } }
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/codexctl/rds-ca/global-bundle.pem
            - name: PGOPTIONS
              value: -c default_transaction_read_only=on
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - { name: rds-ca, mountPath: /etc/codexctl/rds-ca, readOnly: true }
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: rds-ca
          configMap: { name: codexctl-rds-ca }
        - name: temporary
          emptyDir: {}
