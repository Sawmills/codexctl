# Manual successor only; no Kustomization includes this file.
# Suspended by default. Separate HQ GO, unique name, stopped writers/refresh
# owners, reviewed image/target and valid scan authorization are required.
# Do not alter or recreate the completed codexctl-final-backfill-a5 Job.
# This template does not renew the ended B33 a5 scan authorization.
apiVersion: batch/v1
kind: Job
metadata:
  name: codexctl-final-backfill-readonly
  namespace: codexctl
  annotations:
    codexctl.sawmills.ai/manual-only: "true"
    checkov.io/skip1: CKV2_K8S_6=NetworkPolicy codexctl-migration selects this pod.
    checkov.io/skip2:
      CKV_K8S_35=Database credentials come from the codexctl-postgres
      ExternalSecret by design.
spec:
  suspend: true
  template:
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app.kubernetes.io/name: codexctl-migration
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      initContainers:
        - name: prepare-secrets
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -ec
          securityContext:
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - cp /projected/vault-key /keys/vault-key; chmod 600 /keys/vault-key
          volumeMounts:
            - name: projected
              mountPath: /projected
              readOnly: true
            - name: keys
              mountPath: /keys
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: backfill
          image: 767398060436.dkr.ecr.us-east-1.amazonaws.com/codexctl-central@sha256:b00059975ef670e17bdc83b6abd34a0cc7e3ab1b8957107bf2a150bbfe6b859c
          command:
            - codexctl-central
            - backfill
            - --state
            - /data/state
            - --key-file
            - /keys/vault-key
            - --scan-exception
            - b33-a5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: CODEXCTL_CENTRAL_STORE
              value: postgres
            - name: CODEXCTL_CENTRAL_DB_CA_FILE
              value: /etc/codexctl/rds-ca/global-bundle.pem
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-hostname
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codexctl-postgres
                  key: db-password
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/codexctl/rds-ca
              readOnly: true
            - name: state
              mountPath: /data
              readOnly: true
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: temporary
              mountPath: /tmp
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: rds-ca
          configMap:
            name: codexctl-rds-ca
        - name: state
          persistentVolumeClaim:
            claimName: state-codexctl-0
        - name: projected
          secret:
            secretName: codexctl-secrets
            items:
              - key: vault-key
                path: vault-key
            defaultMode: 288
        - name: keys
          emptyDir:
            medium: Memory
        - name: temporary
          emptyDir: {}
      automountServiceAccountToken: false
  backoffLimit: 0
  activeDeadlineSeconds: 1800
