[package]
name = "codexctl"
version = "0.1.31"
edition = "2024"
rust-version = "1.89"
description = "Manage multiple OpenAI Codex CLI accounts"
license = "Apache-2.0"

[features]
default = ["central-prototype"]
central-prototype = [
  "dep:openidconnect",
  "dep:axum",
  "dep:aes-gcm",
  "dep:sha2",
  "dep:tempfile",
  "dep:toml_edit",
  "tokio/process",
  "tokio/io-util",
  "tokio/net",
  "tokio/sync",
  "tokio/time",
  "tokio/signal",
]

[[bin]]
name = "codexctl-central"
path = "src/bin/codexctl-central.rs"
required-features = ["central-prototype"]

[dependencies]
openidconnect = { version = "4", optional = true, default-features = false, features = [
  "reqwest",
  "rustls-tls",
] }
axum = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
toml_edit = { version = "0.22", optional = true }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
crossterm = "0.29"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "6"
futures = "0.3"
libc = "0.2"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
vt100 = "0.16"
tungstenite = { version = "0.30", default-features = false, features = [
  "handshake",
] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
