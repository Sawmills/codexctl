<div
  id="overview"
  data-server-time="{server_time}"
  data-valid-for="{valid_for}"
  data-refresh-margin="{refresh_margin}"
>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a
        class="wordmark"
        href="/accounts"
        translate="no"
        aria-label="codexctl accounts"
        >codexctl<span class="caret" aria-hidden="true"></span
      ></a>
      <div class="identity" id="browser-identity">
        <span class="email" translate="no" id="identity-email">{email}</span>
        <form action="/accounts/sign-out" method="post">
          <button class="link-button" type="submit">Sign out</button>
        </form>
      </div>
    </div>
  </header>
  <main id="main" class="wrap">
    <div class="notice" id="connection" role="status" {notice_hidden}>
      <p id="connection-text">{notice}</p>
      <button class="button small" id="retry" type="button">Retry now</button>
    </div>
    <div class="lead">
      <section class="answer" id="answer-current">{answer}</section>
      <section class="answer" id="answer-fallback" hidden>{fallback}</section>
      {attention}
    </div>
    <p
      id="copy-status"
      class="copy-status"
      role="status"
      aria-live="polite"
    ></p>
    {ledger} {machines}
  </main>
</div>
