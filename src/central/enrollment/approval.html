<section class="panel" aria-labelledby="page-title">
  <h1 id="page-title">Connect {name}?</h1>
  <p class="lede">
    It will get tokens for your server accounts until you revoke it.
  </p>
  <div class="code-check">
    <p class="label">Code shown in your terminal</p>
    <code translate="no">{code}</code>
    <p class="label">Connect only if it matches your terminal exactly.</p>
  </div>
  <dl class="facts-list">
    <div>
      <dt>Signed in as</dt>
      <dd translate="no">{email}</dd>
    </div>
    <div>
      <dt>Machine name</dt>
      <dd>{name}</dd>
    </div>
  </dl>
  <form method="post" action="/auth/approve">
    <input type="hidden" name="approval" value="{approval}" />
    <button class="button primary" type="submit">Connect machine</button>
  </form>
  <p class="footnote">
    Not your machine? Close this page. Nothing connects until you approve.
  </p>
</section>
