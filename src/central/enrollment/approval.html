<h1 id="page-title">Connect {name}?</h1>
<p class="lede">It gets tokens for your server accounts until you revoke it.</p>
<div class="check">
  <p class="muted">Code shown in your terminal</p>
  <code class="code" translate="no">{code}</code>
  <p class="muted">Connect only if it matches exactly.</p>
</div>
<dl>
  <div>
    <dt>Signed in as</dt>
    <dd translate="no">{email}</dd>
  </div>
  <div>
    <dt>Machine</dt>
    <dd>{name}</dd>
  </div>
</dl>
<form class="form" method="post" action="/auth/approve">
  <input type="hidden" name="approval" value="{approval}" />
  <button type="submit">Connect machine</button>
</form>
<p class="muted">Not your machine? Close this page.</p>
