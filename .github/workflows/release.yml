name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: Resolve tag
    # trunk-ignore(actionlint/runner-label): Existing Namespace profile
    runs-on: namespace-profile-sawmills-runner
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "${REF_TYPE}" == "tag" ]]; then
            tag="${REF_NAME}"
            checkout_ref="${REF_NAME}"
            target="$(git rev-list -n 1 "${tag}")"
          else
            version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
            tag="v${version}"
            target="${GITHUB_SHA}"
            checkout_ref="${GITHUB_SHA}"

            existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
            if [[ -n "${existing}" && "${existing}" != "${target}" ]]; then
              echo "Tag ${tag} already points at ${existing}, not ${target}." >&2
              exit 1
            fi
          fi

          if [[ -z "${tag}" || "${tag}" != v* ]]; then
            echo "Expected a v* tag or package version." >&2
            exit 1
          fi

          cargo_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ "${tag}" != "v${cargo_version}" ]]; then
            echo "Tag ${tag} does not match Cargo.toml version ${cargo_version}." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: setup
    # trunk-ignore(actionlint/runner-label): Existing Namespace profile
    runs-on: ${{ fromJSON('{"ubuntu-latest":"namespace-profile-sawmills-runner","ubuntu-22.04-arm":"namespace-profile-sawmills-runner-arm64"}')[matrix.os] || matrix.os }}
    container: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: Darwin_arm64
          # trunk-ignore(actionlint/runner-label): Current GitHub Intel macOS runner label.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: Darwin_x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Linux_x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux_arm64
            container: ubuntu:22.04
    steps:
      - name: Install Ubuntu 22.04 build prerequisites
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            binutils build-essential ca-certificates curl git libssl-dev pkg-config

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify Linux arm64 GLIBC symbol baseline
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          for name in codexctl codexctl-central; do
            binary="target/${{ matrix.target }}/release/${name}"
            highest="$(objdump -T "${binary}" | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -1)"
            printf '%s requires %s\n' "${binary}" "${highest}"
            if [[ "$(printf '%s\n' GLIBC_2.35 "${highest}" | sort -V | tail -1)" != GLIBC_2.35 ]]; then
              echo "::error::${binary} requires ${highest}; maximum supported version is GLIBC_2.35"
              exit 1
            fi
          done

      - name: Verify Linux arm64 compatibility
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
          target/aarch64-unknown-linux-gnu/release/codexctl --version
          target/aarch64-unknown-linux-gnu/release/codexctl-central --help

      - name: Package
        run: |
          set -euo pipefail
          bash scripts/package-release.sh "${{ needs.setup.outputs.tag }}" "${{ matrix.target }}" "${{ matrix.label }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codexctl_${{ matrix.label }}
          path: |
            codexctl_*.tar.gz
            codexctl_*.dSYM.zip
            codexctl_*.uuid.txt
            codexctl_*.sha256

  release:
    name: Publish release
    needs: [setup, build]
    # trunk-ignore(actionlint/runner-label): Existing Namespace profile
    runs-on: namespace-profile-sawmills-runner
    permissions:
      contents: write
    outputs:
      sha_darwin_arm64: ${{ steps.shas.outputs.darwin_arm64 }}
      sha_darwin_x86_64: ${{ steps.shas.outputs.darwin_x86_64 }}
      sha_linux_x86_64: ${{ steps.shas.outputs.linux_x86_64 }}
      sha_linux_arm64: ${{ steps.shas.outputs.linux_arm64 }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - id: shas
        name: Collect checksums
        run: |
          set -euo pipefail
          cd dist
          tag="${{ needs.setup.outputs.tag }}"
          sha() { shasum -a 256 "codexctl_${tag}_$1.tar.gz" | cut -d' ' -f1; }
          {
            echo "darwin_arm64=$(sha Darwin_arm64)"
            echo "darwin_x86_64=$(sha Darwin_x86_64)"
            echo "linux_x86_64=$(sha Linux_x86_64)"
            echo "linux_arm64=$(sha Linux_arm64)"
          } >> "$GITHUB_OUTPUT"

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.setup.outputs.tag }}"
          if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            trap 'rm -rf "${existing}"' EXIT
            gh release download "${tag}" --repo "${{ github.repository }}" \
              --pattern 'codexctl_*' --dir "${existing}"
            for local_asset in dist/codexctl_*; do
              asset_name="$(basename "${local_asset}")"
              remote_asset="${existing}/${asset_name}"
              if [[ ! -f "${remote_asset}" ]]; then
                echo "Existing release is missing ${asset_name}; refusing to mutate it." >&2
                exit 1
              fi
              if ! cmp -s "${local_asset}" "${remote_asset}"; then
                echo "Existing release asset ${asset_name} differs; refusing to replace it." >&2
                exit 1
              fi
            done
            echo "Existing release assets are byte-identical."
          else
            gh release create "${tag}" dist/codexctl_* \
              --repo "${{ github.repository }}" --target "${{ needs.setup.outputs.target }}" \
              --title "${tag}" --generate-notes
          fi

  homebrew:
    name: Update Homebrew tap
    needs: [setup, release]
    # trunk-ignore(actionlint/runner-label): Existing Namespace profile
    runs-on: namespace-profile-sawmills-runner
    steps:
      - id: token
        name: Create token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SAWMILLS_REPO_APP_ID }}
          private-key: ${{ secrets.SAWMILLS_APP_PRIVATE_KEY }}
          owner: Sawmills
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Open formula PR on public tap
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          SHA_DARWIN_ARM64: ${{ needs.release.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_X86_64: ${{ needs.release.outputs.sha_darwin_x86_64 }}
          SHA_LINUX_X86_64: ${{ needs.release.outputs.sha_linux_x86_64 }}
          SHA_LINUX_ARM64: ${{ needs.release.outputs.sha_linux_arm64 }}
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          gh auth setup-git --hostname github.com
          gh repo clone Sawmills/homebrew-tap "${workdir}/tap" -- --depth 1

          cat > "${workdir}/tap/Formula/codexctl.rb" << EOF
          class Codexctl < Formula
            desc "Manage multiple OpenAI Codex CLI accounts"
            homepage "https://github.com/Sawmills/codexctl"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "${base}/codexctl_${TAG}_Darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "${base}/codexctl_${TAG}_Darwin_x86_64.tar.gz"
                sha256 "${SHA_DARWIN_X86_64}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/codexctl_${TAG}_Linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "${base}/codexctl_${TAG}_Linux_x86_64.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"
              end
            end

            def install
              bin.install "codexctl", "codexctl-central"
              generate_completions_from_executable(bin/"codexctl", "completions")
            end

            test do
              help = shell_output("#{bin}/codexctl --help")
              assert_match "Usage:", help
              assert_match "codexctl", help
              server_help = shell_output("#{bin}/codexctl-central --help")
              assert_match "Serve the account API", server_help
              assert_path_exists bash_completion/"codexctl"
              assert_path_exists zsh_completion/"_codexctl"
              assert_path_exists fish_completion/"codexctl.fish"
            end
          end
          EOF
          sed -i 's/^          //' "${workdir}/tap/Formula/codexctl.rb"

          cd "${workdir}/tap"
          if git diff --quiet -- Formula/codexctl.rb; then
            echo "Formula already up to date."
            exit 0
          fi

          # The public tap's main is protected (PR + required checks), so land
          # the update through a PR instead of pushing to main directly.
          branch="codexctl-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add Formula/codexctl.rb
          git commit -m "chore(codexctl): update to ${TAG}"
          git push -f origin "HEAD:${branch}"

          if ! gh pr view "${branch}" --repo Sawmills/homebrew-tap >/dev/null 2>&1; then
            gh pr create --repo Sawmills/homebrew-tap \
              --base main --head "${branch}" \
              --title "chore(codexctl): update to ${TAG}" \
              --body "Automated formula update for codexctl ${TAG}, built from https://github.com/${{ github.repository }}/releases/tag/${TAG}."
          fi

          gh pr merge "${branch}" --repo Sawmills/homebrew-tap --squash --auto --delete-branch \
            --match-head-commit "$(git rev-parse HEAD)"
