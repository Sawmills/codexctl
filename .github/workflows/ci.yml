name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: codexctl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codexctl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/codexctl?sslmode=disable
      CODEXCTL_CENTRAL_DB_TLS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Central prototype
        run: |
          cargo clippy --all-targets --features central-prototype
          cargo test --all-targets --features central-prototype
          cargo test --all-targets --no-default-features
          cargo build --bin codexctl-central --features central-prototype

      - name: Build
        run: cargo build --release

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit Cargo.lock
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  trunk:
    name: Trunk Check
    # trunk-ignore(actionlint/runner-label): Namespace profile
    runs-on: namespace-profile-sawmills-runner-large
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache Trunk and Rust artifacts
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # yamllint disable-line rule:line-length
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: rust
          path: |
            /home/runner/.cache/trunk
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1
        with:
          cache: false
          check-mode: ${{ github.event_name == 'pull_request' && 'pull_request' || 'all' }}

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --all-targets

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Enable and verify symbolic links
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
          $probe = Join-Path $env:RUNNER_TEMP 'codexctl-symlink-probe'
          New-Item -ItemType Directory -Path $probe | Out-Null
          New-Item -ItemType Directory -Path "$probe\directory" | Out-Null
          Set-Content -Path "$probe\file" -Value 'probe'
          New-Item -ItemType SymbolicLink -Path "$probe\directory-link" -Target "$probe\directory" | Out-Null
          New-Item -ItemType SymbolicLink -Path "$probe\file-link" -Target "$probe\file" | Out-Null
      # The central prototype requires Unix process and shell support.
      - name: Clippy
        run: cargo clippy --locked --all-targets --no-default-features
      - name: Test
        run: cargo test --locked --all-targets --no-default-features
      - name: Build
        run: cargo build --locked --release --no-default-features
